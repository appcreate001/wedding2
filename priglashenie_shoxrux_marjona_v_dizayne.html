<title>Свадебное приглашение — Shoxrux &amp; Marjona</title>
<style>
:root{--navy:#173b70;--blue:#7898c2;--pale:#eef4fc;--ink:#294467}
*{box-sizing:border-box}
body{margin:0;padding:18px 10px 34px;background:linear-gradient(145deg,#102b54,#28528a 55%,#102b54);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;background:#fffdf9;border:1px solid #d6e0ee;box-shadow:0 18px 60px #061a3866}
.poster{display:block;width:100%;height:auto}
.countdown-panel{text-align:center;padding:28px 16px 32px;background:linear-gradient(#fffefa,#f0f5fc);border-top:1px solid #c6d5e9}
.kicker{font-size:clamp(15px,3.7vw,22px);letter-spacing:3px;text-transform:uppercase;color:var(--navy);margin:0 0 10px}
.subtitle{font-size:14px;letter-spacing:1px;margin:0 0 20px;color:#617a9f}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-width:500px;margin:0 auto}
.unit{padding:14px 4px;background:#fff;border:1px solid #c8d7e9;box-shadow:0 5px 14px #173b7012}
.number{display:block;font:500 clamp(24px,6vw,38px)/1.1 Arial,sans-serif;color:var(--navy);font-variant-numeric:tabular-nums}
.label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:8px;color:#627da3}
.bottom{margin:20px 0 0;font-size:14px;font-style:italic;color:#315b92}
@media(max-width:380px){body{padding:8px 5px 20px}.timer{gap:5px}.unit{padding:12px 2px}.label{font-size:8px;letter-spacing:.4px}}
</style>

    ['days','hours','minutes','seconds'].forEach(id => el(id).textContent = '00');
    el('message').textContent = left > -86400000
      ? 'Сегодня наша свадьба! Будем рады разделить этот день с вами.'
      : 'Спасибо, что разделили с нами этот особенный день!';
    return;
  }
  const d = Math.floor(left/86400000); left %= 86400000;
  const h = Math.floor(left/3600000); left %= 3600000;
  const m = Math.floor(left/60000); left %= 60000;
  const s = Math.floor(left/1000);
  el('days').textContent = String(d).padStart(2,'0');
  el('hours').textContent = String(h).padStart(2,'0');
  el('minutes').textContent = String(m).padStart(2,'0');
  el('seconds').textContent = String(s).padStart(2,'0');
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
